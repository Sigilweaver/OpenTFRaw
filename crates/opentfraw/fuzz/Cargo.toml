[package]
name = "opentfraw-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

# Keep this crate out of the top-level Cargo workspace (it lives inside
# crates/opentfraw/ but is its own standalone fuzz project, per cargo-fuzz
# convention).
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.opentfraw]
path = ".."

[[bin]]
name = "open"
path = "fuzz_targets/open.rs"
test = false
doc = false
bench = false

[[bin]]
name = "read_scan_peaks"
path = "fuzz_targets/read_scan_peaks.rs"
test = false
doc = false
bench = false

# Pinned to a Core commit until openmassspec-core 4.0.0 is on crates.io; the
# top-level [patch.crates-io] does not reach this standalone workspace.
# Remove before merge.
[patch.crates-io]
openmassspec-core = { git = "https://github.com/Sigilweaver/OpenMassSpecCore", rev = "ab7b7f7851cc26e518688d04a144c7fc0c42afd5" }
