# CI for OpenTFRaw.
#
# Jobs:
#   build         - cargo fmt --check, cargo clippy -D warnings, cargo test
#                   (Linux + macOS via WarpBuild)
#   validate-mzml - convert the committed samples/small.RAW fixture (hermetic,
#                   every push) and a small public Thermo RAW file (downloaded)
#                   to mzML, run scripts/validate_mzml.py for structural
#                   conformance, and validate against the vendored PSI-MS mzML
#                   XSD with xmllint.

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Small LTQ FT file (~15 MB) from PRIDE PXD054004, used for the mzML
  # validation job.  URL is stable because PRIDE uses year/month archive paths.
  PRIDE_RAW_URL: >-
    https://ftp.pride.ebi.ac.uk/pride/data/archive/2025/05/PXD054004/20171113_Map_NS1_1to139_4deg_50uM_001.raw
  PRIDE_RAW_NAME: test.raw

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace --all-targets

  validate-mzml:
    name: mzML structural validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build to_mzml example (release)
        run: cargo build --release --example to_mzml

      - name: Ensure xmllint is available
        run: command -v xmllint || (sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils)

      - name: Convert and schema-validate committed sample (hermetic)
        run: |
          # Runs on every push with no network dependency, using the
          # small.RAW fixture committed under samples/. Guards the Thermo
          # reader -> canonical writer path against the PSI-MS XSD even when
          # the PRIDE download below is unavailable.
          ./target/release/examples/to_mzml samples/small.RAW sample_centroid.mzML
          ./target/release/examples/to_mzml --indexed samples/small.RAW sample_indexed.mzML
          python3 scripts/validate_mzml.py sample_centroid.mzML sample_indexed.mzML
          xmllint --noout --schema schema/mzML1.1.0.xsd sample_centroid.mzML
          xmllint --noout --schema schema/mzML1.1.2_idx.xsd sample_indexed.mzML

      - name: Download test RAW file
        run: |
          wget -q --user-agent="OpenTFRaw-CI/1.0" \
               -O "$PRIDE_RAW_NAME" "$PRIDE_RAW_URL"
          echo "Downloaded $(du -sh $PRIDE_RAW_NAME | cut -f1) RAW file"

      - name: Convert RAW to mzML (centroid)
        run: |
          ./target/release/examples/to_mzml "$PRIDE_RAW_NAME" test_centroid.mzML
          echo "Centroid mzML: $(wc -l < test_centroid.mzML) lines"

      - name: Convert RAW to indexed mzML (centroid)
        run: |
          ./target/release/examples/to_mzml --indexed "$PRIDE_RAW_NAME" test_indexed.mzML
          echo "Indexed mzML: $(wc -l < test_indexed.mzML) lines"

      - name: Convert RAW to mzML (profile)
        run: |
          ./target/release/examples/to_mzml --include-profile "$PRIDE_RAW_NAME" test_profile.mzML
          echo "Profile mzML: $(wc -l < test_profile.mzML) lines"

      - name: Validate mzML structural conformance
        run: |
          python3 scripts/validate_mzml.py \
            test_centroid.mzML \
            test_indexed.mzML \
            test_profile.mzML

      - name: Validate mzML against PSI-MS XSD
        run: |
          # Non-indexed documents (root <mzML>) validate against the base
          # schema; the indexed document (root <indexedmzML>) validates
          # against the index wrapper, which includes the base schema.
          xmllint --noout --schema schema/mzML1.1.0.xsd \
            test_centroid.mzML \
            test_profile.mzML
          xmllint --noout --schema schema/mzML1.1.2_idx.xsd \
            test_indexed.mzML

  docs:
    name: Docs (Docusaurus)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: bun install
        run: bun install --frozen-lockfile
      - name: bun run build:cloudflare
        run: bun run build:cloudflare

