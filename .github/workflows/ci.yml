# CI for OpenTFRaw.
#
# Jobs:
#   build         - cargo fmt --check, cargo clippy -D warnings, cargo test
#                   (Linux, macOS, Windows). Downloads a small corpus fixture
#                   ahead of `cargo test` so crates/opentfraw/tests/conformance.rs
#                   exercises a real decode path instead of skipping - see
#                   Sigilweaver/OpenMassSpec#5.
#   validate-mzml - download a small public Thermo RAW file, convert it to
#                   mzML, run scripts/validate_mzml.py for structural
#                   conformance, and validate against the vendored PSI-MS mzML
#                   XSD with xmllint.
#   fuzz-smoke    - PR-only, gated on crates/opentfraw/src/** changing: runs
#                   the two cargo-fuzz targets (open, read_scan_peaks) for a
#                   fixed 60s each as a crash/panic/hang smoke test. This is
#                   deliberately short and separate from any longer
#                   scheduled/manual fuzzing run.
#   python-tests  - build the opentfraw Python extension (maturin develop)
#                   and run the pytest suite in tests/ against it, using the
#                   same PRIDE RAW fixture as validate-mzml.

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Small LTQ FT file (~15 MB) from PRIDE PXD054004, used for the mzML
  # validation job.  URL is stable because PRIDE uses year/month archive paths.
  PRIDE_RAW_URL: >-
    https://ftp.pride.ebi.ac.uk/pride/data/archive/2025/05/PXD054004/20171113_Map_NS1_1to139_4deg_50uM_001.raw
  PRIDE_RAW_NAME: test.raw
  # Same file as PRIDE_RAW_URL above, cached under corpus/ using the naming
  # convention scripts/fetch_corpus.py's shared fetcher uses
  # (`{accession}_{instrument_label}_{filename}`), so a single download can
  # serve as the conformance-test corpus fixture too. Keep this filename in
  # sync with crates/opentfraw/tests/conformance.rs's fixture() candidates.
  CORPUS_FIXTURE_NAME: PXD054004_LTQ_FT_20171113_Map_NS1_1to139_4deg_50uM_001.raw

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Download corpus fixture for conformance tests
        shell: bash
        run: |
          mkdir -p corpus
          dest="corpus/$CORPUS_FIXTURE_NAME"
          curl -sSL --user-agent "OpenTFRaw-CI/1.0" -o "$dest" "$PRIDE_RAW_URL"
          echo "Downloaded $(du -sh "$dest" | cut -f1) corpus fixture"

      - name: cargo test
        run: cargo test --workspace --all-targets

  validate-mzml:
    name: mzML structural validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build to_mzml example (release)
        run: cargo build --release --example to_mzml

      - name: Ensure xmllint is available
        run: command -v xmllint || (sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils)

      - name: Download test RAW file
        run: |
          wget -q --user-agent="OpenTFRaw-CI/1.0" \
               -O "$PRIDE_RAW_NAME" "$PRIDE_RAW_URL"
          echo "Downloaded $(du -sh $PRIDE_RAW_NAME | cut -f1) RAW file"

      - name: Convert RAW to mzML (centroid)
        run: |
          ./target/release/examples/to_mzml "$PRIDE_RAW_NAME" test_centroid.mzML
          echo "Centroid mzML: $(wc -l < test_centroid.mzML) lines"

      - name: Convert RAW to indexed mzML (centroid)
        run: |
          ./target/release/examples/to_mzml --indexed "$PRIDE_RAW_NAME" test_indexed.mzML
          echo "Indexed mzML: $(wc -l < test_indexed.mzML) lines"

      - name: Convert RAW to mzML (profile)
        run: |
          ./target/release/examples/to_mzml --include-profile "$PRIDE_RAW_NAME" test_profile.mzML
          echo "Profile mzML: $(wc -l < test_profile.mzML) lines"

      - name: Validate mzML structural conformance
        run: |
          python3 scripts/validate_mzml.py \
            test_centroid.mzML \
            test_indexed.mzML \
            test_profile.mzML

      - name: Validate mzML against PSI-MS XSD
        run: |
          # Non-indexed documents (root <mzML>) validate against the base
          # schema; the indexed document (root <indexedmzML>) validates
          # against the index wrapper, which includes the base schema.
          xmllint --noout --schema schema/mzML1.1.0.xsd \
            test_centroid.mzML \
            test_profile.mzML
          xmllint --noout --schema schema/mzML1.1.2_idx.xsd \
            test_indexed.mzML

  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      opentfraw_src: ${{ steps.filter.outputs.opentfraw_src }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            opentfraw_src:
              - 'crates/opentfraw/src/**'

  fuzz-smoke:
    name: Fuzz smoke test (60s)
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.opentfraw_src == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/opentfraw/fuzz -> target

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Seed the fuzz corpus with a small real RAW fixture
        run: |
          wget -q --user-agent="OpenTFRaw-CI/1.0" \
               -O "$PRIDE_RAW_NAME" "$PRIDE_RAW_URL"
          mkdir -p crates/opentfraw/fuzz/corpus/open crates/opentfraw/fuzz/corpus/read_scan_peaks
          cp "$PRIDE_RAW_NAME" crates/opentfraw/fuzz/corpus/open/
          cp "$PRIDE_RAW_NAME" crates/opentfraw/fuzz/corpus/read_scan_peaks/

      - name: Fuzz RawFileReader::open (60s)
        working-directory: crates/opentfraw/fuzz
        run: cargo fuzz run open corpus/open -- -max_total_time=60

      - name: Fuzz read_scan_peaks (60s)
        working-directory: crates/opentfraw/fuzz
        run: cargo fuzz run read_scan_peaks corpus/read_scan_peaks -- -max_total_time=60

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crash-artifacts
          path: crates/opentfraw/fuzz/artifacts/

  python-tests:
    name: Python bindings (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: uv sync (dev dependencies)
        run: uv sync

      - name: maturin develop
        run: uv run maturin develop --release

      - name: pytest
        run: uv run pytest tests -v

  docs:
    name: Docs (Docusaurus)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: bun install
        run: bun install --frozen-lockfile
      - name: bun run build:cloudflare
        run: bun run build:cloudflare

