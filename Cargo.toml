[workspace]
resolver = "2"
members = ["crates/opentfraw", "crates/opentfraw-py"]

[workspace.package]
version = "4.0.0"
edition = "2021"
rust-version = "1.88"
authors = ["Nathan Riley <git@nathanriley.com>"]
license = "Apache-2.0"
repository = "https://github.com/Sigilweaver/OpenTFRaw"
homepage = "https://sigilweaver.app/opentfraw/"
documentation = "https://sigilweaver.app/opentfraw/docs/"
keywords = ["mass-spectrometry", "thermo", "raw", "proteomics", "orbitrap"]
categories = ["parser-implementations", "science"]

[workspace.dependencies]
opentfraw = { path = "crates/opentfraw" }
openmassspec-core = "4.0.0"
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310"] }
numpy = "0.29"

[workspace.lints.rust]
unsafe_code = "forbid"

# Pinned to a Core commit until openmassspec-core 4.0.0 is on crates.io.
# Remove before merge.
[patch.crates-io]
openmassspec-core = { git = "https://github.com/Sigilweaver/OpenMassSpecCore", rev = "ab7b7f7851cc26e518688d04a144c7fc0c42afd5" }
